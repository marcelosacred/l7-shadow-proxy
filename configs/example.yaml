server:
  listen: ":8080"
  read_header_timeout: 5s
  max_header_bytes: 1048576
  max_body_bytes: 10485760
  shutdown_timeout: 30s

metrics:
  listen: ":9090"

upstreams:
  backend1:
    targets:
      - "http://127.0.0.1:8081"
    timeout: 3s
    max_conns_per_host: 100

  backend2:
    targets:
      - "http://127.0.0.1:8082"
    timeout: 5s
    max_conns_per_host: 50

routes:
  - name: "api"
    match:
      path:
        prefix: "/api"
    upstream: "backend1"

  - name: "web"
    match:
      path:
        prefix: "/"
    upstream: "backend2"

fallback:
  upstream: "backend1"